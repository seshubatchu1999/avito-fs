server.port=8080

# Application configuration
app.google.cloud.project=${GOOGLE_CLOUD_PROJECT:}
app.google.cloud.location=${GOOGLE_CLOUD_LOCATION:us-central1}
app.google.credentials=${GOOGLE_APPLICATION_CREDENTIALS:}
app.vertex.model=${VERTEX_GEMINI_MODEL:gemini-2.5-flash}
app.hbl.issuer=${HBL_ISSUER:Global Logistics Partners (HK) Ltd. - NVOCC License #MC-445721}
app.mbl.issuer=${MBL_ISSUER:Ocean Carrier}
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.enforced=${AUTH_ENFORCED:false}

# File Upload Limit (20 MB default)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# PostgreSQL Database Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON serialization
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
